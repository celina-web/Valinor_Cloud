services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/turnoflex
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    # -L: polling, necesario para detectar cambios en Docker Desktop (Mac/Windows)
    command: npx nodemon -L src/index.js
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
